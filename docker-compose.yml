services:
  # ── LibreChat (чат-интерфейс агента) ──────────────────────────
  api:
    container_name: librechat
    image: registry.librechat.ai/danny-avila/librechat-dev:latest
    ports:
      - "${PORT:-3080}:${PORT:-3080}"
    depends_on:
      - mongodb
      - meilisearch
    restart: always
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/LibreChat}
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - ALLOW_EMAIL_LOGIN=${ALLOW_EMAIL_LOGIN:-true}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
      - ./images:/app/client/public/images
      - ./uploads:/app/uploads

  # ── MongoDB (БД LibreChat) ─────────────────────────────────────
  mongodb:
    container_name: chat-mongodb
    image: mongo:7
    restart: always
    volumes:
      - mongodb-data:/data/db
    command: mongod --noauth

  # ── Meilisearch (поиск по сообщениям) ──────────────────────────
  meilisearch:
    container_name: chat-meilisearch
    image: getmeili/meilisearch:v1.35.1
    restart: always
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - meilisearch-data:/meili_data

  # ── ELMA365 MCP-сервер ─────────────────────────────────────────
  elma365-mcp:
    container_name: elma365-mcp
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - ELMA365_DOMAIN=${ELMA365_DOMAIN}
      - ELMA365_TOKEN=${ELMA365_TOKEN}
    # Не выставляем порт наружу — доступ только внутри docker-сети

volumes:
  mongodb-data:
  meilisearch-data:
