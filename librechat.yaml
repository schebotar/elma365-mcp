version: 1.3.13
cache: true

# ── DeepSeek LLM ──────────────────────────────────────────────────
endpoints:
  agents:
    recursionLimit: 100
  custom:
    - name: "DeepSeek"
      apiKey: "${DEEPSEEK_API_KEY}"
      baseURL: "https://api.deepseek.com/v1"
      models:
        default:
          - "deepseek-chat"
          - "deepseek-reasoner"
        fetch: true
      titleConvo: true
      titleModel: "deepseek-chat"
      modelDisplayLabel: "DeepSeek"

# ── MCP-сервер ELMA365 ───────────────────────────────────────────
mcpServers:
  elma365:
    type: streamable-http
    url: http://elma365-mcp:3000/mcp
    timeout: 60000

mcpSettings:
  allowedDomains:
    - "elma365-mcp"
    - "*.docker.internal"
    - "host.docker.internal"
